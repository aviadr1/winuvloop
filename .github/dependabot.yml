version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Jerusalem"
    rebase-strategy: "auto"
    open-pull-requests-limit: 10
    groups:
      upstream-event-loops:
        patterns:
          - "uvloop"
          - "winloop"
      python-dev-tools:
        patterns:
          - "pytest"
          - "ruff"
          - "uv-build"
    ignore:
      # Keep Python 3.8-compatible dev tool pins until runtime support drops 3.8.
      - dependency-name: "build"
        versions:
          - ">=1.3"
      - dependency-name: "twine"
        versions:
          - ">=6"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "python"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:30"
      timezone: "Asia/Jerusalem"
    rebase-strategy: "auto"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
