name: Bug report
description: Report a winuvloop compatibility or packaging problem.
title: "Bug: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: winuvloop version
      placeholder: "0.2.1"
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Selected backend
      options:
        - uvloop
        - winloop
        - unknown
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.11"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11, Ubuntu 24.04, macOS 15"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal commands or code that reproduce the issue.
      render: python
    validations:
      required: true
